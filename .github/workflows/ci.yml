name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check format (Prettier)
        run: npx prettier --check .

      # Lint de shell con versión fijada (el runner no trae shellcheck).
      - name: Lint shell scripts (shellcheck)
        run: |
          pipx install "shellcheck-py==0.11.0.1"
          shellcheck -S warning herramientas/linkml/scripts/*.sh \
            herramientas/linkml/scripts/tests/*.sh scripts/*.sh \
            .husky/pre-commit .husky/commit-msg

      # Versiones fijadas: un linter de workflows sin pin sería la misma
      # cadena de suministro que estamos auditando.
      - name: Install workflow linters (actionlint + zizmor)
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          pipx install "zizmor==1.32.0"

      - name: Lint and audit workflows
        run: |
          actionlint .github/workflows/ci.yml
          zizmor --persona=regular .github/workflows/

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  validate-structure:
    name: Validate P1 Structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate P1 structure
        run: bash scripts/check-structure.sh . --profile P1

      - name: Validate contracts (version, CI jobs, docs, pinned uses)
        run: make validate-contracts

  linkml:
    name: Validate LinkML Tools
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: herramientas/linkml/assets/requirements-linkml.lock

      - name: Install LinkML (locked with hashes)
        run: |
          python -m pip install --upgrade pip==25.1
          pip install --require-hashes -r herramientas/linkml/assets/requirements-linkml.lock

      - name: Validate LinkML (smoke + ciclo real)
        run: bash herramientas/linkml/scripts/tests/smoke_sh.sh

      # pytest usa los testpaths de pyproject: herramientas LinkML + contratos.
      - name: Tests de scripts y herramientas (pytest)
        run: python -m pytest -q

  linkml-container:
    name: LinkML in Container (digest-pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Verificación real de reproducibilidad: mismo ciclo, sin instalar nada
      # en el host, con la imagen oficial fijada por digest.
      - name: Validate cycle in OCI container
        run: bash herramientas/linkml/scripts/validate_cycle_container.sh

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check docs format
        run: make validate-docs

      - name: Check relative markdown links
        run: make validate-links

  browser-gates:
    name: Browser Gates (a11y + perf)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Chromium de Playwright. Sin dependencias del sistema: el runner ya las
      # trae (imagen con Chrome) y así el gate no depende del gestor de paquetes,
      # que ha fallado por incidencias del mirror (503) y tumbaba el job.
      - name: Install Chromium (Playwright)
        run: npx playwright install chromium

      - name: Accessibility + reflow (Chromium real)
        run: npm run test:browser:a11y

      - name: Performance budgets (Lighthouse CI)
        run: npm run test:browser:perf

  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz |
          tar -xz gitleaks && chmod +x gitleaks && sudo mv gitleaks /usr/local/bin/

      - name: Run gitleaks
        run: gitleaks detect --config .gitleaks.toml --verbose --redact

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
