name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check format (Prettier)
        run: npx prettier --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  validate-structure:
    name: Validate P1 Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required P1 files exist
        run: |
          required_files=(
            "LICENSE"
            "CHANGELOG.md"
            "SECURITY.md"
            "CONTRIBUTING.md"
            "AGENTS.md"
            "ARCHITECTURE.md"
            "Makefile"
            ".env.example"
            ".github/workflows/ci.yml"
            ".github/CODEOWNERS"
            ".github/renovate.json"
            ".github/PULL_REQUEST_TEMPLATE.md"
            ".github/ISSUE_TEMPLATE/bug.yml"
            ".github/ISSUE_TEMPLATE/feature.yml"
            "docs/architecture"
            "docs/guides"
            "docs/runbooks"
            "docs/README.md"
          )
          missing=0
          for f in "${required_files[@]}"; do
            if [[ ! -e "$f" ]]; then
              echo "FALTA: $f"
              missing=1
            fi
          done
          # Check meta-section in README.md
          if ! grep -q "### Propósito de este documento" README.md; then
            echo "FALTA meta-sección en README.md"
            missing=1
          fi
          if [[ $missing -eq 1 ]]; then
            exit 1
          fi
          echo "✅ Estructura P1 OK"

  smoke:
    name: Validate LinkML Tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LinkML
        run: |
          python -m pip install --upgrade pip
          pip install linkml

      - name: Validate LinkML (smoke)
        run: bash herramientas/linkml/scripts/tests/smoke_sh.sh

  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check docs format
        run: npx prettier --check documentacion/ docs/ README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md AGENTS.md ARCHITECTURE.md 2>/dev/null || true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
